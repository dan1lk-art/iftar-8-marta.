<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <title>Приглашение на Ифтар 🌙</title>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <section id="intro-screen">
        <div class="gift-wrapper">
            <div class="gift-box" role="button" aria-label="Открыть подарок">🎁</div>
            <div class="gift-glow"></div>
            <p class="instruction">Нажми на подарок, чтобы увидеть чудо</p>
        </div>
    </section>

    <main class="container">
        <article id="main-card">
            <header class="card-header">
                <span class="event-type">Приглашение на Ифтар</span>
                <h1>С праздником весны!</h1>
                <div class="divider">🌙✨</div>
            </header>

            <section class="card-body">
                <p class="greeting-text">
                    В этот прекрасный весенний день мы будем рады разделить с вами тепло вечерней трапезы. Приглашаем вас на праздничный Ифтар.
                </p>

                <div class="event-details">
                    <div class="detail-item">
                        <span class="icon">📍</span>
                        <div class="text-group">
                            <small>Место</small>
                            <strong>Уалиханның үиі"</strong>
                        </div>
                    </div>
                    
                    <div class="detail-item">
                        <span class="icon">⏰</span>
                        <div class="text-group">
                            <small>Время </small>
                            <strong>7 март</strong>
                        </div>
                    </div>
                </div>
            </section>

            <footer class="card-footer">
                <button type="button" class="btn-rsvp" id="confirm-button">
                    <span>Обязательно приду!</span>
                    <div class="flare"></div>
                </button>
            </footer>
        </article>
    </main>

    <script src="script.js"></script>
</body>

</html>
